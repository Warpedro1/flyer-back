name: CI

on:
  pull_request:
  push:
    branches: [main]

# Por omissão o workflow só lê. Os jobs que precisam de escrever pedem-no
# explicitamente, para o token não andar com mais poder do que o necessário.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      # Sem .env de propósito: o tests/conftest.py preenche o mínimo que o
      # Settings exige, e assim este CI nunca precisa de segredos nenhuns.
      # Verificado antes de commitar: 107 testes passam com o .env escondido.
      - name: pytest
        run: pytest -q

  tamanho-da-funcao:
    name: Tamanho da função na Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Um venv limpo só com o requirements.txt — o que a Vercel instala.
      # O requirements-dev.txt não conta: nada dele vai para a função.
      - name: Instalar só as dependências de produção
        run: |
          python -m venv /tmp/prod
          /tmp/prod/bin/pip install --quiet --upgrade pip
          /tmp/prod/bin/pip install --quiet -r requirements.txt

      - name: Comparar com o limite da Vercel
        env:
          # A Vercel corta aos 250 MB descompactados. O alarme dispara antes,
          # para haver margem para reagir em vez de descobrir no deploy.
          ALARME_MB: 200
        run: |
          SP=/tmp/prod/lib/python3.11/site-packages
          total=$(du -sb "$SP" | cut -f1)
          # pip e setuptools não fazem parte do que corre na função.
          for d in pip setuptools wheel; do
            if [ -d "$SP/$d" ]; then
              total=$(( total - $(du -sb "$SP/$d" | cut -f1) ))
            fi
          done
          mb=$(( total / 1048576 ))
          echo "### Dependências de produção: ${mb} MB" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | MB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Medido | ${mb} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Alarme deste CI | ${ALARME_MB} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Limite da Vercel | 250 |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Maiores pacotes:" >> "$GITHUB_STEP_SUMMARY"
          du -sh "$SP"/* 2>/dev/null | sort -rh | head -8 \
            | sed 's|.*/||; s|^|- |' >> "$GITHUB_STEP_SUMMARY"
          echo "Dependências de produção: ${mb} MB (alarme: ${ALARME_MB}, limite Vercel: 250)"
          if [ "$mb" -gt "$ALARME_MB" ]; then
            echo "::error::As dependências de produção estão em ${mb} MB e passaram o alarme de ${ALARME_MB} MB. O limite da Vercel são 250 MB descompactados — acima disso o deploy falha. Ver o resumo do job para os maiores pacotes."
            exit 1
          fi

  aprovar:
    name: Aprovar automaticamente
    needs: [testes, tamanho-da-funcao]
    # Só PRs do próprio repositório. Um PR vindo de um fork nunca é aprovado
    # sozinho: o código é de terceiros e os testes dele passarem não diz nada
    # sobre a intenção de quem o escreveu.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      # Porque é que isto não usa o GITHUB_TOKEN:
      #
      #   "GitHub Actions is not permitted to approve pull requests."  (HTTP 422)
      #
      # É uma restrição da plataforma, não uma questão de permissões — testado
      # neste repositório com `pull-requests: write` concedido, e a API recusa
      # mesmo assim. Aprovar exige um token de uma IDENTIDADE HUMANA OU DE APP,
      # e que não seja a autora do PR (a GitHub também não deixa aprovar o
      # próprio PR).
      #
      # Para ligar a aprovação automática, criar um secret APPROVAL_TOKEN com
      # um PAT de uma segunda conta com acesso de escrita ao repositório, ou um
      # token de instalação de uma GitHub App. Sem o secret, este job informa e
      # passa — não fica vermelho de propósito.
      #
      # Alternativa que NÃO precisa de token nenhum, e que é o mecanismo certo
      # se o objetivo é "só entra com os testes verdes": branch protection em
      # `main` com required status checks. Aí é a plataforma a bloquear o merge,
      # em vez de um bot a simular um visto.
      APPROVAL_TOKEN: ${{ secrets.APPROVAL_TOKEN }}
    steps:
      - name: Há token de aprovação configurado?
        id: token
        run: |
          if [ -z "${APPROVAL_TOKEN}" ]; then
            echo "presente=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Aprovação automática desligada::As verificações passaram, mas não há secret APPROVAL_TOKEN. O GITHUB_TOKEN não pode aprovar PRs (restrição da GitHub). Ver o comentário no topo deste job."
          else
            echo "presente=true" >> "$GITHUB_OUTPUT"
          fi

      # actions/github-script é da própria GitHub. Há ações de terceiros que
      # fazem isto em menos linhas, mas dar-lhes um token com permissão de
      # escrita em PRs é superfície de ataque que não se justifica aqui.
      - name: Aprovar
        if: steps.token.outputs.presente == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.APPROVAL_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // Idempotente: um push novo ao mesmo PR não empilha aprovações.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const me = await github.rest.users.getAuthenticated();
            const jaAprovado = reviews.some(
              (r) => r.state === 'APPROVED'
                  && r.user?.login === me.data.login
                  && r.commit_id === pr.head.sha,
            );
            if (jaAprovado) {
              core.info(`Já existe aprovação para ${pr.head.sha}. Nada a fazer.`);
              return;
            }

            if (pr.user.login === me.data.login) {
              core.warning(
                `O APPROVAL_TOKEN pertence a ${me.data.login}, que é quem abriu ` +
                `este PR. A GitHub não deixa aprovar o próprio PR — precisa de ` +
                `ser um token de outra conta ou de uma GitHub App.`,
              );
              return;
            }

            await github.rest.pulls.createReview({
              owner, repo, pull_number: pr.number,
              event: 'APPROVE',
              body: [
                'Aprovado automaticamente: as verificações do CI passaram.',
                '',
                '**O que isto verifica e o que não verifica.** Os testes cobrem',
                'a lógica da aplicação. Não vêem permissões da base de dados,',
                'políticas de RLS, nem segredos mal colocados — neste mesmo',
                'repositório os 107 testes passaram enquanto as funções',
                '`rsvp_*` estavam abertas ao role `anon`, e qualquer pessoa',
                'conseguia admitir participantes sem QR. Uma aprovação daqui',
                'não substitui ler o diff quando ele toca em permissões,',
                'autenticação ou migrações.',
              ].join('\n'),
            });
            core.info(`PR #${pr.number} aprovado em ${pr.head.sha}.`);
